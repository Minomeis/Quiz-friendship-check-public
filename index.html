<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf6ef">
  <title>测测你是不是正在经历一段消耗型友情</title>
  <!-- 空图标：避免浏览器去请求不存在的 favicon.ico -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <!-- 开始页 -->
    <section id="view-start" class="view" hidden>
      <header class="start-cover">
        <p id="start-subtitle" class="start-subtitle"></p>
        <h1 id="start-title" class="start-title"></h1>
        <div class="friendship-art" aria-hidden="true"><i></i><i></i><b></b></div>
        <button type="button" id="btn-start" class="btn btn-primary">开始测试<span class="arrow" aria-hidden="true"></span></button>
      </header>
      <div id="start-intro" class="intro"></div>
      <p id="start-disclaimer" class="disclaimer"></p>
    </section>

    <!-- 答题页 -->
    <section id="view-quiz" class="view" hidden>
      <div class="quiz-top">
        <button type="button" id="btn-prev" class="btn btn-ghost" hidden>上一题</button>
        <span id="quiz-count" class="quiz-count"></span>
      </div>
      <div id="quiz-progress" class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="20" aria-label="答题进度"><i id="quiz-progress-fill"></i></div>
      <div class="question-panel"><span class="question-mark" aria-hidden="true"></span><h2 id="quiz-text" class="quiz-text"></h2></div>
      <div id="quiz-options" class="options"></div>
    </section>

    <!-- 结果页：内容由 js/app.js 生成 -->
    <section id="view-result" class="view" hidden>
      <div id="result-body"></div>
      <div class="result-end">
        <div class="end-actions">
          <button type="button" id="btn-save-bottom" class="btn btn-ghost">保存结果</button>
          <button type="button" id="btn-ai-bottom" class="btn btn-ghost">复制给 AI，聊聊我的结果</button>
        </div>
        <button type="button" id="btn-restart" class="btn btn-primary">重新测试</button>
        <p id="result-disclaimer" class="disclaimer"></p>
      </div>
    </section>
  </main>

  <div id="copy-notice" class="copy-notice" role="status" hidden>
    <span>已复制，打开豆包、DeepSeek、Kimi 等任意 AI，粘贴发送即可</span>
    <button type="button" id="copy-notice-close" class="btn btn-ghost">关闭</button>
  </div>
  <div id="copy-layer" class="layer" hidden>
    <div class="dialog copy-dialog" role="dialog" aria-modal="true" aria-labelledby="copy-title">
      <span class="sheet-handle" aria-hidden="true"></span>
      <div class="copy-heading">
        <p id="copy-title" class="dialog-text">长按全选后复制</p>
        <button type="button" id="copy-close" class="btn btn-ghost">关闭</button>
      </div>
      <textarea id="copy-text" aria-label="待复制的结果文字" readonly></textarea>
    </div>
  </div>

  <!-- 重新测试的确认层（页面内自绘，不用浏览器自带弹窗） -->
  <div id="confirm-layer" class="layer" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-text">
      <span class="sheet-handle" aria-hidden="true"></span>
      <div class="confirm-symbol" aria-hidden="true"></div>
      <p id="confirm-text" class="dialog-text">重新测试会清空本次结果，建议先截图保存。</p>
      <div class="dialog-btns">
        <button type="button" id="btn-cancel" class="btn btn-ghost">取消</button>
        <button type="button" id="btn-confirm" class="btn btn-primary">确认重测</button>
      </div>
    </div>
  </div>

  <div id="save-layer" class="layer" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="save-title">
      <span class="sheet-handle" aria-hidden="true"></span>
      <p id="save-title" class="dialog-text">选择长图版本</p>
      <div class="save-choices">
        <button type="button" id="save-short" class="btn btn-primary">简版长图</button>
        <button type="button" id="save-full" class="btn btn-primary">完整长图</button>
        <button type="button" id="save-cancel" class="btn btn-ghost">取消</button>
      </div>
      <p id="save-status" role="status" hidden></p>
    </div>
  </div>
  <div id="preview-layer" class="preview-layer" role="dialog" aria-modal="true" aria-label="长图预览" hidden>
    <div class="preview-toolbar"><p>长按图片保存到相册</p><div><button type="button" id="download-images" class="btn btn-primary">下载图片</button><button type="button" id="preview-close" class="btn btn-ghost">关闭</button></div></div>
    <div id="preview-images" class="preview-images"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/ai-text.js"></script>
  <script src="js/share-image.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
